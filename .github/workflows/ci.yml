name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while an older run is still going makes that run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` typechecks too, but running it alone here means a type
      # error is reported as a type error rather than as a failed build.
      - run: npx tsc --noEmit

      - run: npm test

      # Building here means a broken build fails the checks rather than
      # surfacing for the first time during a deploy.
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    # The whole point of this workflow: nothing ships unless the checks passed.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilt rather than carried over from the check job: the build takes
      # seconds, and passing artifacts between jobs is more moving parts than
      # it saves.
      - run: npm run build

      # No wranglerVersion given, so the action uses the version pinned in
      # package.json — deploys and local runs stay on the same wrangler.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
