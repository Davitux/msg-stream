#           node-version: 22
#           cache: npm
#
#       - run: npm ci
#
#       # Rebuilt rather than carried over from the check job: the build takes
#       # seconds, and passing artifacts between jobs is more moving parts than
#       # it saves.
#       - run: npm run build
#
#       # No wranglerVersion given, so the action uses the version pinned in
#       # package.json — deploys and local runs stay on the same wrangler.
#       - uses: cloudflare/wrangler-action@v4
