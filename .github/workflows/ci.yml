name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while an older run is still going makes that run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Next generates route and layout types into .next/types, and tsc needs
      # them — without this, `LayoutProps` and friends are simply undefined and
      # the typecheck fails on code that is perfectly correct. It passes locally
      # only because a previous build left .next/ behind.
      - run: npx next typegen

      # `next build` typechecks too, but running it alone here means a type
      # error is reported as a type error rather than as a failed build.
      - run: npx tsc --noEmit

      - run: npm test

      # Building here means a broken build fails the checks rather than
      # surfacing for the first time during a deploy.
      - run: npm run build

  # ------------------------------------------------------------------
  # Deploying from here is disabled: Cloudflare's own Git integration does
  # it instead. Kept rather than deleted, because turning it back on is the
  # way to make a deploy wait for the checks below — Cloudflare deploys on
  # push whether or not they passed.
  #
  # To re-enable: uncomment, and add CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID as repository secrets.
  # ------------------------------------------------------------------
#   deploy:
#     name: Deploy to Cloudflare
#     # The whole point of this workflow: nothing ships unless the checks passed.
#     needs: check
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
