<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="msg-stream">
  <!--
    Three feeds in, one out.

    The three short bars are platform channels in the hues the rows use for
    YouTube, Twitch and Kick; the long bar is the merged inbox in the cash
    colour, which this interface reserves for money. Every value is copied
    from the tokens in app/globals.css, and tests/favicon.test.ts pins them
    so the mark cannot drift away from the palette it was drawn from.

    The dark ground is deliberate rather than transparent: a favicon sits on
    browser chrome we do not control, so it carries the ink colour with it
    and reads the same on a light or a dark tab strip. That is also why the
    dark theme hues are the right ones here even though the app ships a
    light palette too.

    Note for editors: XML forbids a double hyphen inside a comment, so the
    CSS custom properties are named in prose above rather than written out.
  -->
  <rect width="32" height="32" rx="7" fill="#0e1013"/>
  <rect x="6" y="5" width="12" height="4" rx="2" fill="#ff3b30"/>
  <rect x="6" y="11" width="12" height="4" rx="2" fill="#a970ff"/>
  <rect x="6" y="17" width="12" height="4" rx="2" fill="#53fc18"/>
  <rect x="6" y="23" width="20" height="4" rx="2" fill="#ffc247"/>
</svg>
